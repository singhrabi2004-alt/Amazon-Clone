<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details - Amazon Clone</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <!-- Logo -->

        <div class="logo">

            <span>amazon</span>

            <small>.clone</small>

        </div>


        <!-- Search -->

        <div class="search-box">

            <input
                type="text"
                placeholder="Search Amazon Clone"
            >

            <button>

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

        </div>


        <!-- Cart -->

        <a href="cart.html" class="cart">

            <i class="fa-solid fa-cart-shopping"></i>

            <strong>Cart</strong>

        </a>

    </header>



    <!-- ================= SECOND NAV ================= -->

    <nav class="sub-nav">

        <a href="index.html">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Home

        </a>

    </nav>



    <!-- ================= PRODUCT DETAILS ================= -->

    <main class="product-details">


        <!-- Product Image -->

        <div
            class="product-detail-image"
            id="product-image"
        >
            📦
        </div>



        <!-- Product Information -->

        <div class="product-detail-info">


            <h1 id="product-name">
                Product Name
            </h1>


            <p
                class="product-category"
                id="product-category"
            >
                Category
            </p>


            <hr>


            <p
                class="product-description"
                id="product-description"
            >
                Product description
            </p>



            <!-- Price -->

            <div class="product-price">

                <span id="product-price">
                    ₹0
                </span>


                <span
                    class="detail-discount"
                    id="product-discount"
                >
                    0% off
                </span>

            </div>



            <!-- Add To Cart -->

            <button
                class="add-cart-btn"
                id="add-to-cart"
            >
                Add to Cart
            </button>


        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>


</body>

</html>
