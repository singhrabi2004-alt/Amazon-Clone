<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Successful - Nova Cart</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">

            <span>nova</span>

            <small>cart</small>

        </div>

    </header>



    <!-- ================= SUCCESS ================= -->

    <main class="success-page">

        <div class="success-card">

            <div class="success-icon">

                <i class="fa-solid fa-circle-check"></i>

            </div>


            <h1>
                Payment Successful!
            </h1>


            <h2>
                🎉 Order Placed Successfully!
            </h2>


            <p>
                Thank you for shopping with Nova Cart
            </p>


            <div class="order-details">

                <p>
                    <strong>Order Number:</strong>
                    <span id="order-number">
                        #000000
                    </span>
                </p>


                <p>
                    <strong>Amount Paid:</strong>
                    <span id="amount-paid">
                        ₹0
                    </span>
                </p>


                <p>
                    <strong>Payment Method:</strong>
                    <span id="payment-method">
                        -
                    </span>
                </p>


                <p>
                    <strong>Customer:</strong>
                    <span id="customer-name">
                        -
                    </span>
                </p>

            </div>


            <div class="success-buttons">

                <a
                    href="index.html"
                    class="home-btn"
                >
                    <i class="fa-solid fa-house"></i>
                    Continue Shopping
                </a>


                <a
                    href="cart.html"
                    class="cart-btn"
                >
                    <i class="fa-solid fa-cart-shopping"></i>
                    View Cart
                </a>

            </div>

        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const savedOrder =
            JSON.parse(
                localStorage.getItem("lastOrder")
            );
    
    
        function displayOrder(order) {
    
            document.getElementById(
                "order-number"
            ).textContent =
                "#" + order.orderNumber;
    
    
            document.getElementById(
                "amount-paid"
            ).textContent =
                "₹" +
                Number(order.total)
                    .toLocaleString("en-IN");
    
    
            document.getElementById(
                "payment-method"
            ).textContent =
                order.paymentMethod.toUpperCase();
    
    
            document.getElementById(
                "customer-name"
            ).textContent =
                order.customerName;
    
        }
    
    
        async function loadOrder() {
    
            if (!savedOrder) {
    
                console.log(
                    "No order found"
                );
    
                return;
    
            }
    
    
            // Display saved order first
            displayOrder(savedOrder);
    
    
            // Then get latest order from MongoDB
            try {
    
                const response =
                    await fetch(
                        `https://nova-cart-backend.onrender.com/api/orders/${savedOrder.orderNumber}`
                    );
    
    
                if (!response.ok) {
                    return;
                }
    
    
                const order =
                    await response.json();
    
    
                // Update page with MongoDB order
                displayOrder(order);
    
    
                console.log(
                    "Order loaded from MongoDB"
                );
    
            } catch (error) {
    
                console.log(
                    "MongoDB fetch failed, using saved order"
                );
    
            }
    
        }
    
    
        loadOrder();
    
    </script>

</body>

</html>
