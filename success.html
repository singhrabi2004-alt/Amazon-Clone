<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Successful - Amazon Clone</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">

            <span>amazon</span>

            <small>.clone</small>

        </div>

    </header>



    <!-- ================= SUCCESS ================= -->

    <main class="success-page">

        <div class="success-card">

            <div class="success-icon">

                <i class="fa-solid fa-circle-check"></i>

            </div>


            <h1>
                Payment Successful!
            </h1>


            <h2>
                🎉 Order Placed Successfully!
            </h2>


            <p>
                Thank you for shopping with Amazon Clone.
            </p>


            <div class="order-details">

                <p>
                    <strong>Order Number:</strong>
                    <span id="order-number">
                        #000000
                    </span>
                </p>


                <p>
                    <strong>Amount Paid:</strong>
                    <span id="amount-paid">
                        ₹0
                    </span>
                </p>


                <p>
                    <strong>Payment Method:</strong>
                    <span id="payment-method">
                        -
                    </span>
                </p>


                <p>
                    <strong>Customer:</strong>
                    <span id="customer-name">
                        -
                    </span>
                </p>

            </div>


            <div class="success-buttons">

                <a
                    href="index.html"
                    class="home-btn"
                >
                    <i class="fa-solid fa-house"></i>
                    Continue Shopping
                </a>


                <a
                    href="cart.html"
                    class="cart-btn"
                >
                    <i class="fa-solid fa-cart-shopping"></i>
                    View Cart
                </a>

            </div>

        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const order =
            JSON.parse(
                localStorage.getItem("lastOrder")
            );


        if (order) {

            document.getElementById(
                "order-number"
            ).textContent =
                "#" + order.orderNumber;


            document.getElementById(
                "amount-paid"
            ).textContent =
                "₹" +
                order.total.toLocaleString("en-IN");


            document.getElementById(
                "payment-method"
            ).textContent =
                order.paymentMethod.toUpperCase();


            document.getElementById(
                "customer-name"
            ).textContent =
                order.customerName;

        }

    </script>


</body>

</html>
